name: Check for broken links

# Disabled: too many false positives from external sites (rate-limiting, bot-blocking).
# Local/offline link checking is handled by broken-links-site.yml instead.
on:
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # removed md files that include liquid tags
          args: >-
            --exclude-path CUSTOMIZE.md
            --exclude-path README.md
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude 'https://opensource\.googleblog\.com'
            --exclude 'https://www\.cybertec-postgresql\.com'
            --exclude 'https://twitter\.com'
            --exclude 'https://x\.com'
            --max-retries 5
            --retry-wait-time 10
            --timeout 30
            --accept 429
            --verbose
            --no-progress
            './**/*.md'
            './**/*.html'
